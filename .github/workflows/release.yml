name: "Release macOS (Apple Silicon)"

# Runs when a GitHub Release is published (or manually for an existing
# release tag) and attaches Apple Silicon build artifacts to that release:
#   CrossMTP_<version>_aarch64.dmg
#   CrossMTP_<version>_aarch64.app.zip
#   SHA256SUMS.txt
#
# The app links the system libmtp dynamically (docs/install.md), so users
# still need `brew install libmtp`. Builds are unsigned / not notarized.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach artifacts to (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-14 # Apple Silicon runner
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TARGET: aarch64-apple-darwin
      PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Verify tag matches app version
        run: |
          APP_VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v${APP_VERSION}" != "${TAG}" ]; then
            echo "::error::Release tag ${TAG} does not match app version v${APP_VERSION} (tauri.conf.json)"
            exit 1
          fi
          echo "VERSION=${APP_VERSION}" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: brew install pkg-config libmtp

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Build app bundle
        run: npm run tauri build -- --target "$TARGET" --bundles app,dmg
        working-directory: apps/desktop

      - name: Package artifacts
        run: |
          BUNDLE="target/${TARGET}/release/bundle"
          OUT="release-assets"
          mkdir -p "$OUT"
          DMG=$(ls "$BUNDLE"/dmg/*.dmg | head -n 1)
          cp "$DMG" "$OUT/CrossMTP_${VERSION}_aarch64.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$BUNDLE/macos/CrossMTP.app" "$OUT/CrossMTP_${VERSION}_aarch64.app.zip"
          (cd "$OUT" && shasum -a 256 *.dmg *.zip > SHA256SUMS.txt)
          file "$BUNDLE/macos/CrossMTP.app/Contents/MacOS/"*
          ls -la "$OUT"
          cat "$OUT/SHA256SUMS.txt"

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep a copy as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossMTP-${{ env.VERSION }}-macos-arm64
          path: release-assets/*
          retention-days: 14
